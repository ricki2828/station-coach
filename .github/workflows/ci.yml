name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # No `secrets: inherit`, so this always takes the skip path: it proves the lane exists and stays green without an account.
  testflight-skip-path:
    uses: ./.github/workflows/testflight.yml
  report-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy jsonschema
      - run: python3 -m unittest discover -s tools/tests -v
      - name: TestFlight gate names every missing secret and stays green
        run: tools/ci/test-testflight-gate.sh
      - name: Fixture is current
        run: |
          python3 tools/make_fixture.py
          git diff --exit-code tools/fixtures

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (the toolchain the TestFlight lane uses)
        run: tools/ci/select-xcode.sh
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: CoachKit unit tests
        working-directory: Packages/CoachKit
        run: swift test
      - name: Build watch app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project StationCoach.xcodeproj -scheme StationCoachWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Build iOS app with embedded watch app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project StationCoach.xcodeproj -scheme StationCoach \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Build iOS app with embedded watch app (Release, simulator)
        run: |
          set -o pipefail
          xcodebuild -project StationCoach.xcodeproj -scheme StationCoach -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30
      - name: Privacy manifests are valid, correct, and inside both built apps (Debug and Release)
        run: |
          set -eo pipefail
          plutil -lint iOS/PrivacyInfo.xcprivacy Watch/PrivacyInfo.xcprivacy
          python3 - <<'PY'
          import plistlib
          def reasons(p):
              d = plistlib.load(open(p, "rb"))
              assert d["NSPrivacyTracking"] is False and d["NSPrivacyTrackingDomains"] == [], p
              assert d["NSPrivacyCollectedDataTypes"] == [], p
              return {a["NSPrivacyAccessedAPIType"].replace("NSPrivacyAccessedAPICategory", ""): a["NSPrivacyAccessedAPITypeReasons"] for a in d["NSPrivacyAccessedAPITypes"]}
          ios = {"UserDefaults": ["CA92.1"], "FileTimestamp": ["C617.1"]}
          assert reasons("iOS/PrivacyInfo.xcprivacy") == ios, reasons("iOS/PrivacyInfo.xcprivacy")
          assert reasons("Watch/PrivacyInfo.xcprivacy") == {**ios, "SystemBootTime": ["8FFB.1"]}, reasons("Watch/PrivacyInfo.xcprivacy")
          PY
          dd=~/Library/Developer/Xcode/DerivedData
          for cfg in Debug Release; do
            ios_app=$(find $dd -path "*Build/Products/$cfg-iphonesimulator/StationCoach.app" -maxdepth 6 -type d | head -1)
            echo "$cfg iOS app: $ios_app"
            test -n "$ios_app" || { echo "no $cfg iOS app"; exit 1; }
            embedded=$(find "$ios_app" -name StationCoachWatch.app -type d | head -1)
            watch_app=$(find $dd -path "*Build/Products/$cfg-watchsimulator/StationCoachWatch.app" -maxdepth 6 -type d | head -1)
            for app in "$ios_app" "$embedded" $watch_app; do
              test -f "$app/PrivacyInfo.xcprivacy" || { echo "no PrivacyInfo.xcprivacy in $app"; exit 1; }
              plutil -lint "$app/PrivacyInfo.xcprivacy"
            done
          done
      - name: Render screens (iOS simulator host, watch views at 46 mm)
        working-directory: Packages/CoachUI
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/screens"
          xcodebuild -list | head -20
          TEST_RUNNER_SCREENS_DIR="$RUNNER_TEMP/screens" xcodebuild test -scheme CoachUI \
            -destination 'platform=iOS Simulator,name=iPhone 16' | tail -60
          cp "$GITHUB_WORKSPACE"/iOS/Assets.xcassets/AppIcon.appiconset/icon-1024.png "$RUNNER_TEMP/screens/app-icon.png"
          ls "$RUNNER_TEMP/screens" | wc -l
      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
