name: ci
on:
  push:
  pull_request:

jobs:
  # No `secrets: inherit`, so this always takes the skip path: it proves the lane exists and stays green without an account.
  testflight-skip-path:
    uses: ./.github/workflows/testflight.yml
  report-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python3 -m unittest discover -s tools/tests -v
      - name: TestFlight gate names every missing secret and stays green
        run: tools/ci/test-testflight-gate.sh
      - name: Fixture is current
        run: |
          python3 tools/make_fixture.py
          git diff --exit-code tools/fixtures

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: CoachKit unit tests
        working-directory: Packages/CoachKit
        run: swift test
      - name: Build watch app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project StationCoach.xcodeproj -scheme StationCoachWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Build iOS app with embedded watch app (simulator)
        run: |
          set -o pipefail
          xcodebuild -project StationCoach.xcodeproj -scheme StationCoach \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Render screens (iOS simulator host, watch views at 46 mm)
        working-directory: Packages/CoachUI
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/screens"
          xcodebuild -list | head -20
          TEST_RUNNER_SCREENS_DIR="$RUNNER_TEMP/screens" xcodebuild test -scheme CoachUI \
            -destination 'platform=iOS Simulator,name=iPhone 16' | tail -60
          cp "$GITHUB_WORKSPACE"/iOS/Assets.xcassets/AppIcon.appiconset/icon-1024.png "$RUNNER_TEMP/screens/app-icon.png"
          ls "$RUNNER_TEMP/screens" | wc -l
      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
